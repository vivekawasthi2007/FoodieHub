<!DOCTYPE html>
<html lang="en">
<head>
    <title>Send OTP - FoodieHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-96 text-center border border-gray-100">
        <h2 class="text-3xl font-extrabold text-gray-800 mb-2">🍔 FoodieHub</h2>
        <p class="text-gray-500 mb-6 font-medium">Enter your email to receive an OTP</p>
        
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <input type="email" name="email" required placeholder="Enter your email address" 
                       class="w-full border-2 border-gray-200 p-3 rounded-lg focus:outline-none focus:border-red-500 transition">
            </div>
            
            <button type="submit" class="w-full bg-red-600 text-white font-bold text-lg py-3 rounded-lg hover:bg-red-700 shadow-md transition transform hover:-translate-y-1">
                Send OTP ✉️
            </button>
        </form>
        
        <div class="mt-6">
            <a href="{% url 'login' %}" class="text-blue-500 font-bold hover:underline text-sm">Back to Login</a>
        </div>
    </div>

</body>
</html>
