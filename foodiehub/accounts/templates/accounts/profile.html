<!DOCTYPE html>
<html>
<head>
    <title>My Profile - FoodieHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">

    <nav class="bg-red-600 text-white p-4 shadow-md">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <a href="{% url 'menu' %}" class="text-2xl font-bold">🍔 FoodieHub</a>
            <a href="{% url 'menu' %}" class="font-semibold hover:text-red-200">Back to Menu</a>
        </div>
    </nav>

    <div class="max-w-xl mx-auto mt-12 p-8 bg-white shadow-xl rounded-2xl border border-gray-100">
        <div class="text-center mb-6">
            <h2 class="text-3xl font-black text-gray-800">My Profile 👤</h2>
            <p class="text-gray-500 mt-1">Username: <span class="font-bold text-red-500">@{{ request.user.username }}</span></p>
        </div>

        <form method="POST" class="space-y-5">
            {% csrf_token %}
            
            <div>
                <label class="block text-gray-700 font-bold mb-2">Email Address</label>
                <input type="email" value="{{ request.user.email }}" class="w-full border-2 border-gray-200 p-3 rounded-lg bg-gray-100 cursor-not-allowed" disabled>
            </div>

            <div>
                <label class="block text-gray-700 font-bold mb-2">Phone Number</label>
                <input type="text" name="phone" value="{% if profile.phone_number %}{{ profile.phone_number }}{% endif %}" placeholder="Enter your mobile number" class="w-full border-2 border-gray-200 p-3 rounded-lg focus:outline-none focus:border-red-500">
            </div>

            <div>
                <label class="block text-gray-700 font-bold mb-2">Delivery Address</label>
                <textarea name="address" rows="3" placeholder="Enter your full home or office address" class="w-full border-2 border-gray-200 p-3 rounded-lg focus:outline-none focus:border-red-500">{% if profile.address %}{{ profile.address }}{% endif %}</textarea>
            </div>

            <button type="submit" class="w-full bg-red-500 text-white font-bold py-3 rounded-xl hover:bg-red-600 shadow-md transition transform hover:scale-105">
                Save & Update Profile
            </button>
        </form>
    </div>

</body>
</html>
