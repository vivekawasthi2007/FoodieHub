<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodieHub - Menu</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">

    <nav class="bg-red-600 text-white p-4 shadow-md">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">🍔 FoodieHub</h1>
          <div class="flex items-center space-x-6">
    <a href="{% url 'wishlist' %}" class="font-semibold hover:text-red-200">❤️ Favorites</a>
    <a href="{% url 'profile' %}" class="font-semibold hover:text-red-200">👤 My Profile</a>
    <a href="{% url 'cart' %}" class="font-semibold hover:text-red-200">🛒 My Cart</a>
</div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto mt-10 p-4">
         <form method="GET" class="mb-8 flex justify-center">
        <input type="text" name="q" placeholder="Search for pizza, burger..." class="border-2 border-gray-300 p-2 rounded-l-lg w-64 focus:outline-none focus:border-red-500">
       <button type="submit" class="bg-red-500 text-white px-6 py-2 rounded-r-lg font-bold">Search</button>
       </form>
        <h2 class="text-3xl font-extrabold text-gray-800 mb-8 text-center">Our Delicious Menu</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            {% for item in foods %}
            <div class="bg-white rounded-lg shadow-lg p-5 border border-gray-100">
                <div class="flex justify-between items-start">
    <h3 class="text-xl font-bold text-gray-800">{{ item.name }}</h3>
    {% if user.is_authenticated %}
        <a href="{% url 'toggle_wishlist' item.id %}" class="text-2xl hover:scale-125 transition transform">
            {% if item.id in user_wishlist %}
                ❤️
            {% else %}
                🤍
            {% endif %}
        </a>
    {% endif %}
</div>
                <p class="text-sm text-gray-500 mt-2 h-10">{{ item.description }}</p>
                <div class="mt-4 flex justify-between items-center">
                    <span class="text-2xl font-extrabold text-green-600">₹{{ item.price }}</span>

                    <a href="{% url 'add_to_cart' item.id %}">
                    <button class="bg-red-500 text-white px-4 py-2 rounded shadow hover:bg-red-600 transition">
                     Add to Cart
                    </button>
                    </a>
                </div>
            </div>
            {% endfor %}
            </div>
    </main>

</body>
</html>
